name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pos:
    name: pos service — typecheck, test, build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@tillflow/pos

      - name: Test
        run: npm run test --workspace=@tillflow/pos

      - name: Build image
        run: docker build -f services/pos/Dockerfile -t tillflow-pos:${{ github.sha }} .

      # This is the PR-check build (never pushed anywhere) - the actual deploy pipeline
      # (deploy-pos.yml) builds and pushes its own image to ECR by commit SHA separately.
      # Reusing Trivy for the SBOM rather than adding a fourth tool, since it's already
      # wired in for scanning below.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tillflow-pos:${{ github.sha }}
          format: cyclonedx
          output: sbom-pos.cdx.json

      - name: Upload SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-pos-${{ github.sha }}
          path: sbom-pos.cdx.json
          retention-days: 90

  terraform:
    name: infra — fmt, validate (plan needs AWS creds, wired once OIDC exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: fmt check
        run: terraform fmt -check -recursive infra/

      - name: validate (bootstrap)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate (main stack)
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

  security-scan:
    name: secrets + dependency + IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — filesystem (secrets + dependency vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy — IaC misconfiguration (infra/)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: "1"

  # TODO(G1): Terraform plan-on-PR + gated apply on master, both via the ci-deploy OIDC
  #           role that already exists (infra/iam.tf) - next up.
  # TODO(G2): payments / commission jobs, path-filtered so unrelated changes don't rebuild
  #           every service.
