name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pos:
    name: pos service — typecheck, test, build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@tillflow/pos

      - name: Test
        run: npm run test --workspace=@tillflow/pos

      - name: Build image (no push yet — registry wiring lands with the Platform gate)
        run: docker build -f services/pos/Dockerfile -t tillflow-pos:${{ github.sha }} .

  # TODO(G1): secret + dependency + IaC scan, SBOM, image scan, Terraform plan-on-PR.
  # TODO(G2): payments / commission jobs, path-filtered so unrelated changes don't rebuild
  #           every service.
