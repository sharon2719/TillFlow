name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pos:
    name: pos service — typecheck, test, build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@tillflow/pos

      - name: Test
        run: npm run test --workspace=@tillflow/pos

      - name: Build image
        run: docker build -f services/pos/Dockerfile -t tillflow-pos:${{ github.sha }} .

      # This is the PR-check build (never pushed anywhere) - the actual deploy pipeline
      # (deploy-pos.yml) builds and pushes its own image to ECR by commit SHA separately.
      # Reusing Trivy for the SBOM rather than adding a fourth tool, since it's already
      # wired in for scanning below.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tillflow-pos:${{ github.sha }}
          format: cyclonedx
          output: sbom-pos.cdx.json

      - name: Upload SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-pos-${{ github.sha }}
          path: sbom-pos.cdx.json
          retention-days: 90

  payments:
    name: payments service — typecheck, test, build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@tillflow/payments

      - name: Test
        run: npm run test --workspace=@tillflow/payments

      - name: Build image
        run: docker build -f services/payments/Dockerfile -t tillflow-payments:${{ github.sha }} .

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tillflow-payments:${{ github.sha }}
          format: cyclonedx
          output: sbom-payments.cdx.json

      - name: Upload SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-payments-${{ github.sha }}
          path: sbom-payments.cdx.json
          retention-days: 90

  commission:
    name: commission service — typecheck, test, build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@tillflow/commission

      - name: Test
        run: npm run test --workspace=@tillflow/commission

      - name: Build image
        run: docker build -f services/commission/Dockerfile -t tillflow-commission:${{ github.sha }} .

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tillflow-commission:${{ github.sha }}
          format: cyclonedx
          output: sbom-commission.cdx.json

      - name: Upload SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-commission-${{ github.sha }}
          path: sbom-commission.cdx.json
          retention-days: 90

  terraform:
    name: infra — fmt + validate (both stacks; bootstrap stays hand-applied, see its own header)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: fmt check
        run: terraform fmt -check -recursive infra/

      - name: validate (bootstrap)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate (main stack, no backend)
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

  terraform-plan:
    name: infra — real plan against AWS (PRs only; bootstrap excluded, see its own header)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC -> AWS
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Assume the ci-deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::240462142849:role/devops-g5-ci-deploy
          aws-region: eu-west-1

      - name: terraform plan (main stack, real backend)
        working-directory: infra
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color

  security-scan:
    name: secrets + dependency + IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — filesystem (secrets + dependency vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy — IaC misconfiguration (infra/)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Gated apply on merge to master lives in .github/workflows/infra-apply.yml, not here -
  # separate workflow so it can target its own GitHub Environment approval gate.
