name: Infra apply (gated)

# Only the main infra/ stack - infra/bootstrap stays manually applied on purpose (see its
# own header comment: it's the one stack that has to bootstrap its own remote state, so
# it's rarely touched after the first time).
#
# Manual trigger only - deliberately NOT on push. The original design used a GitHub
# Environment's "required reviewers" protection rule as the approval gate, but that's a
# paid-plan feature for private repositories (Pro/Team/Enterprise) and isn't available here.
# Confirmed by checking the environment's settings directly: the Deployment protection
# rules section (where "Required reviewers" lives) doesn't render at all on this repo's
# current plan - not a misconfiguration, a plan limitation. Rather than have infra changes
# silently auto-apply on every merge with no gate at all, this requires a human to
# deliberately open the Actions tab and click "Run workflow" after reviewing the merged
# PR's plan output - not as strong as a real reviewer-approval step, but it's a genuine gate
# (nothing applies without someone consciously choosing to run it), and it's free. Logged in
# docs/production-readiness.md.
on:
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC -> AWS
  contents: read

jobs:
  apply:
    name: terraform apply (manually triggered - see workflow header)
    runs-on: ubuntu-latest
    # Kept associated with the infra-apply environment for audit visibility in the repo's
    # Environments tab, even without a reviewer gate on this plan - if this repo ever moves
    # to a plan with environment protection rules, adding a required reviewer here is the
    # only change needed to get the originally-intended stronger gate back.
    environment:
      name: infra-apply
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Assume the ci-deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::240462142849:role/devops-g5-ci-deploy
          aws-region: eu-west-1

      - name: terraform apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
